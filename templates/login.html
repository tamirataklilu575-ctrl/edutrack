{% extends "base.html" %}

{% block title %}Log In{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <section class="panel form-panel">
        <header class="page-header">
            <h2>Log In</h2>
            <p>Sign in with the login your school administrator gave you.</p>
        </header>

        <form method="POST">
            <div class="form-group">
                <label for="login">Email or username</label>
                <input type="text" id="login" name="login"
                       value="{{ form.login }}" autocomplete="username"
                       autocapitalize="none" autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       autocomplete="current-password">
            </div>

            <button type="submit" class="btn">Log In</button>
        </form>

        <p class="auth-switch">
            Accounts are created by your school administrator.
            Forgot your password? Ask them to reset it.
        </p>
    </section>
</div>
{% endblock %}
